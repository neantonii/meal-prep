# data/units.yaml
# Standard Measurement Units & Universal Physics Conversions

units:
  mass:
    base: g
    allowed:
      g: [g, gram, grams]
      kg: [kg, kilogram, kilograms]
      lb: [lb, lbs, pound, pounds]
      oz: [oz, ounce, ounces]
    conversions:
      kg:
        amount: 1000
        unit: g
      lb:
        amount: 453.59
        unit: g
      oz:
        amount: 28.35
        unit: g

  volume:
    base: ml
    allowed:
      ml: [ml, milliliter, milliliters]
      l: [l, liter, liters, litre, litres]
      tsp: [tsp, teaspoon, teaspoons]
      tbsp: [tbsp, tablespoon, tablespoons]
      cup: [cup, cups]
      fl_oz: [fl oz, fl_oz, fluid ounce, fluid ounces]
    conversions:
      l:
        amount: 1000
        unit: ml
      tsp:
        amount: 5
        unit: ml
      tbsp:
        amount: 15
        unit: ml
      cup:
        amount: 240
        unit: ml
      fl_oz:
        amount: 29.57
        unit: ml

  # Reserved retail node. `package` is a canonical token like `g` or `ml`, but
  # it has no universal conversions: what "1 package" means differs per
  # ingredient (4 chicken pieces vs 4540 g of rice), so every `package -> *`
  # edge is authored on the ingredient itself. It must never be shadowed by a
  # custom unit.
  package:
    base: package
    allowed:
      package: [package]
    conversions: {}

  # Reserved count node. A count is what an omitted unit (`@apple{1}`) means:
  # a unitless amount that still needs an ingredient-authored `count -> g` edge
  # to participate in gram math. Like `package`, it has no universal conversions.
  count:
    base: count
    allowed:
      count: [count]
    conversions: {}
