    calories_kcal: 94.1
    protein_g: 2.4
    fat_g: 1.2
    carbs_g: 20.0
    fiber_g: 2.4
    saturated_fat_g: 0.1
    sugars_g: 1.2
    sodium_mg: 10.0
    potassium_mg: 264.7

  conversions:
    - from: cup
      to: g
      factor: 145.0

