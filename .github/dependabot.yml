# Version updates wait out a cooldown so fresh releases get time to be vetted
# (patch/minor 30 days, major 90 days, the maximum Dependabot allows).
# Security updates ignore the cooldown and arrive immediately.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 30
      semver-major-days: 90
      semver-minor-days: 30
      semver-patch-days: 30

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 30
      semver-major-days: 90
      semver-minor-days: 30
      semver-patch-days: 30

  # github-actions supports only default-days. Workflows pin actions to major
  # tags (@v7), so every proposed update is a major bump: use the major wait.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 90

  # Images in the Dockerfile (base images, uv) are pinned by digest. docker
  # supports only default-days. Most updates are new digests of the same tag,
  # carrying OS security patches, so they use the 30-day wait; a runtime major
  # bump (node/python) fails tests/test_deploy.py until CI follows.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
