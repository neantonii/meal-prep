name: image

# Builds the container image and smoke-tests it on every PR; on pushes to
# master it also publishes ghcr.io/<owner>/meal-prep as :latest and
# :sha-<commit> (for rollback). Plain docker CLI, no third-party actions.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/meal-prep
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        run: docker build --tag meal-prep:ci .
      - name: Smoke test (health, UI, API, diary save)
        run: |
          mkdir -p diary logs && sudo chown 1000:1000 diary logs
          docker run -d --name smoke -p 127.0.0.1:8000:8000 \
            -v "$PWD/diary:/app/diary" -v "$PWD/logs:/app/logs" meal-prep:ci
          for _ in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl -fs http://127.0.0.1:8000/ | grep -q '<div id="root">'
          curl -fs http://127.0.0.1:8000/api/catalog > /dev/null
          curl -fs -X POST -H 'Content-Type: application/json' \
            -d '{"week":"2026-W44","days":[{"date":"2026-10-26","breakfast":["flat-white"]}]}' \
            http://127.0.0.1:8000/api/diary/2026-W44 > /dev/null
          test -f diary/2026-W44.yaml
      - name: Container logs
        if: always()
        run: docker logs smoke || true
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag meal-prep:ci "$IMAGE:latest"
          docker tag meal-prep:ci "$IMAGE:sha-${GITHUB_SHA::12}"
          docker push "$IMAGE:sha-${GITHUB_SHA::12}"
          docker push "$IMAGE:latest"
