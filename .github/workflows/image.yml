name: image

# Builds the container image and smoke-tests it (scripts/smoke_image.sh) on
# every PR; on pushes to master it also publishes ghcr.io/<owner>/meal-prep as
# :latest and :sha-<commit> (for rollback). Plain docker CLI, no third-party
# actions.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/meal-prep
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        run: docker build --tag meal-prep:ci .
      # What the smoke test checks lives in the script (normal code review);
      # it prints the container's logs and cleans up on exit.
      - name: Smoke test
        run: scripts/smoke_image.sh meal-prep:ci
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag meal-prep:ci "$IMAGE:latest"
          docker tag meal-prep:ci "$IMAGE:sha-${GITHUB_SHA::12}"
          docker push "$IMAGE:sha-${GITHUB_SHA::12}"
          docker push "$IMAGE:latest"
