name: ci

# Every check runs through the Dockerfile, which is the single source of the
# Python, Node and uv versions (no setup-* actions here: a second copy of a
# version is one Dependabot can't keep in step). Reproduce locally with the
# same commands. `--output type=cacheonly`: a check only needs to know the
# stage built; exporting the unused image would add ~10 s per job.
# No build cache on purpose: a GitHub Actions layer cache (#132) measured
# slower overall (#133): its ~15 s setup per job outweighed what it saved.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint, types, tests (Dockerfile `test` stage)
        run: docker build --target test --progress=plain --output type=cacheonly .

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: UI lint, typecheck, build (Dockerfile `ui` stage)
        run: docker build --target ui --progress=plain --output type=cacheonly .
