name: ci

# Every check runs through the Dockerfile, which is the single source of the
# Python, Node and uv versions (no setup-* actions here: a second copy of a
# version is one Dependabot can't keep in step). Reproduce locally with the
# same commands.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint, types, tests (Dockerfile `test` stage)
        run: docker build --target test --progress=plain .

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: UI lint, typecheck, build (Dockerfile `ui` stage)
        run: docker build --target ui --progress=plain .
