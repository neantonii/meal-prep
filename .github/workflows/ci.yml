name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
      - name: Install (fails if uv.lock is out of sync with pyproject.toml)
        run: uv sync --locked
      - name: Ruff check
        run: uv run --locked ruff check .
      - name: Ruff format
        run: uv run --locked ruff format . --check
      - name: Mypy
        run: uv run --locked mypy
      - name: Pytest
        run: uv run --locked pytest -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/.nvmrc
      - name: Install (fails if package-lock.json is out of sync)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
