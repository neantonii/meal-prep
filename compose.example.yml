name: meal-prep

# Copy to compose.yml on the host, create ./diary and ./logs next to it, owned
# by uid 1000 (the container's user), then:
#   docker compose pull && docker compose up -d
# Updating = the same two commands: CI publishes a new image on every push to
# master. Diary weeks persist in ./diary, server logs in ./logs.

services:
  diary:
    image: ghcr.io/neantonii/meal-prep:latest
    # To build from a local checkout instead of pulling: replace `image:` with
    #   build: .
    restart: unless-stopped
    # Loopback only: no auth in v1, so don't expose it beyond the host
    # without a reverse proxy in front.
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - ./diary:/app/diary
      - ./logs:/app/logs
      # The host's time zone decides which day is "today" (Plan vs Log);
      # without it the container runs on UTC and the day turns over early.
      - /etc/localtime:/etc/localtime:ro
