[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meal-prep"
version = "0.1.0"
description = "Home-use meal-prep system"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
# The planner (CP-SAT solver) is the only user of OR-Tools, which brings
# numpy, pandas and protobuf. Kept out of [project] so the server image
# doesn't ship ~225 MB it never imports; installed by default for dev and CI.
planner = [
    "ortools==9.15.6755",
]
dev = [
    "httpx2==2.13.1", # starlette TestClient
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.uv]
default-groups = ["dev", "planner"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (unused imports, undefined names)
    "I",      # isort (deterministic import ordering)
    "UP",     # pyupgrade (modern syntax: `X | Y` over `Union[X, Y]`)
    "B",      # flake8-bugbear (common traps, mutable default args)
    "C4",     # flake8-comprehensions (cleaner comprehension patterns)
    "SIM",    # flake8-simplify (catches nested ifs, redundant branches)
    "TID252", # flake8-tidy-imports (bans relative parent imports like `from ..models`)
    "RUF",    # Ruff-specific invariants and optimizations
]
ignore = [
    "E501",   # line length is owned by `ruff format`
    "B008",   # allow `Field(...)` in Pydantic default args
]

[tool.ruff.lint.isort]
known-first-party = ["meal_prep"]

[tool.ruff.lint.per-file-ignores]
# Relax rules for test suites
"tests/**/*" = [
    "S101",   # allow `assert` in tests
    "ARG",    # allow unused fixtures/arguments
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "src"
files = "src"

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true # no stubs for PyYAML
